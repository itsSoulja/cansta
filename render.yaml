# The live service is named "cansta" (https://cansta.onrender.com) and serves
# only the API and sockets. The client is a separate Cloudflare Pages project,
# also "cansta" (https://cansta.pages.dev), built with VITE_SERVER_URL pointed
# at the Render origin — see the deployment notes in CLAUDE.md.
services:
  - type: web
    name: cansta
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
